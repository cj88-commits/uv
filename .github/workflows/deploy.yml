name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # refresh-cams-data.yml commits and pushes new forecast data using the
  # default GITHUB_TOKEN. GitHub deliberately does not let a GITHUB_TOKEN-
  # authenticated push trigger other workflows' `push` events (it's the
  # anti-recursion guard) -- so without this trigger, a successful data
  # refresh would sit committed in the repo but never actually get
  # deployed to Pages. This restores that cascade explicitly.
  workflow_run:
    workflows: ["Refresh CAMS UV data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only deploy on a successful refresh -- a failed refresh (e.g. CAMS
    # temporarily unavailable) leaves the previous data in place and
    # shouldn't trigger a no-op rebuild/redeploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
